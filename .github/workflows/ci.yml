name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp run lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run type check
        run: vp run typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Prepare Nuxt
        run: vp exec nuxt prepare

      - name: Run unit tests with coverage
        run: vp test --project unit --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/junit.xml
          flags: unit
          fail_ci_if_error: false

  nuxt:
    name: Nuxt Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Prepare Nuxt
        run: vp exec nuxt prepare

      - name: Run nuxt integration tests
        run: vp test --project nuxt

  browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Prepare Nuxt
        run: vp exec nuxt prepare

      - name: Install Playwright Chromium
        run: vp exec playwright install chromium --with-deps

      - name: Run browser tests
        run: vp test --project nuxt-browser

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: nuxt-build
          path: .output

      - name: Install Playwright Chromium
        run: vp exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: vp run test:browser

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuxt-build
          path: .output/
          include-hidden-files: true
          retention-days: 7

  knip:
    name: Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Prepare Nuxt
        run: vp exec nuxt prepare

      - name: Check for unused code
        run: vp run knip

  lighthouse:
    name: Lighthouse (${{ matrix.theme }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    strategy:
      matrix:
        theme: [light, dark]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: nuxt-build
          path: .output

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        env:
          COLOR_SCHEME: ${{ matrix.theme }}
        with:
          configPath: ./.lighthouserc.cjs
